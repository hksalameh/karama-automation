# Build a single Windows executable for Karama Automation.
name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kafala_compare_app.py'
      - 'kafala_compare_app_v2.py'
      - 'test_matching_logic.py'
      - 'auto_update_gui.py'
      - 'auto_update_from_diff.js'
      - 'patch_auto_update_js.py'
      - 'KafalaCompareApp_fixed.spec'
      - 'KafalaCompareApp.iss'
      - 'build_exe.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pandas openpyxl xlrd

      - name: Apply browser compatibility fixes
        shell: pwsh
        run: python patch_auto_update_js.py

      - name: Validate matching and automation code
        shell: pwsh
        run: |
          python -m py_compile kafala_compare_app.py kafala_compare_app_v2.py auto_update_gui.py patch_auto_update_js.py
          python test_matching_logic.py
          node --check auto_update_from_diff.js
          if (-not (Select-String -Path '.\auto_update_from_diff.js' -Pattern 'YEAR_FIELD_ROBUST_V3' -Quiet)) { throw 'Year-field patch missing' }
          if (-not (Select-String -Path '.\auto_update_from_diff.js' -Pattern 'DISBURSEMENT_READY_V1' -Quiet)) { throw 'Disbursement readiness patch missing' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows app
        shell: pwsh
        run: .\build_exe.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path '.\dist\KafalaCompareApp.exe')) { throw 'EXE missing' }
          Get-Item '.\dist\KafalaCompareApp.exe' | Format-Table Name, Length

      - name: Upload single Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: KafalaCompareApp-Windows
          if-no-files-found: error
          retention-days: 14
          path: dist/KafalaCompareApp.exe
